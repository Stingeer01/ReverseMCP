name: Feature request
description: Propose a tool, backend capability, format, architecture, or skill improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the analysis task that cannot be completed cleanly today.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: For a tool, include inputs, structured outputs, limits, side effects, and failure cases.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain the current workaround and why an existing tool or skill is insufficient.

  - type: textarea
    id: sources
    attributes:
      label: Technical sources
      description: Link format specifications, vendor documentation, upstream code, or primary research.

  - type: checkboxes
    id: authorization
    attributes:
      label: Scope
      options:
        - label: The request is compatible with authorized analysis and the repository's security boundaries.
          required: true
